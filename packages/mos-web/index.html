<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="MOS — a marketing-engineering operating system: declared mission, complete loop."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MOS</title>
    <script>
      // Pre-paint theme resolution (WEB-001; light default since the wave-24
      // target-design conversion) — resolve the persisted `mos-theme` seed
      // before the JS bundle executes so a dark-theme user never sees a light
      // first frame. Mirrors src/platform/theme-seed.ts; that module is the
      // canonical, tested version.
      (() => {
        const STORAGE_KEY = 'mos-theme';
        const DEFAULT_THEME = 'light';
        const THEME_COLORS = { dark: '#020617', light: '#f8fafc' };
        const syncThemeSurface = (theme) => {
          const root = document.documentElement;
          root.setAttribute('data-mos-theme', theme);
          root.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', THEME_COLORS[theme]);
        };
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          const seed =
            saved === 'light' || saved === 'dark' || saved === 'system' ? saved : DEFAULT_THEME;
          const resolved =
            seed === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : seed;
          syncThemeSurface(resolved);
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch {
          syncThemeSurface('light');
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f8fafc;
        color: #334155;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      html[data-mos-theme='dark'] body {
        background: #020617;
        color: #e2e8f0;
      }

      /* Boot loading shell (pre-JS): stays visible from first paint until
         the React bundle mounts the app — the loading state of the very
         first route load, so there is no white gap. */
      .mos-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 100vh;
        background: #f8fafc;
        color: #64748b;
        font-size: 14px;
      }

      html[data-mos-theme='dark'] .mos-boot-loading {
        background: #020617;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mos-boot-loading" role="status" aria-live="polite" aria-busy="true">
        Loading the MOS shell…
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

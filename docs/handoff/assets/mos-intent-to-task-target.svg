<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">MOS universal intent composer and long-running task UX</title>
<desc id="desc">Illustrative desktop interaction from a contextual action through a chat composer, clarification by text or voice, intent summary, durable task creation and task activity.</desc>
<defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0b1f38"/></linearGradient><linearGradient id="a3"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e7f1ff}.h{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:700;fill:#f7faff}.m{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#a9c0da}.s{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#7796b6}.line{stroke:#24425f;stroke-width:1}.card{fill:#0e2540;stroke:#244667;stroke-width:1}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}</style></defs>
<rect width="1600" height="1000" rx="18" fill="url(#bg3)"/><rect width="1600" height="42" rx="18" fill="#07111e"/><rect y="25" width="1600" height="17" fill="#07111e"/><rect x="18" y="12" width="18" height="18" rx="5" fill="url(#a3)"/><text x="48" y="26" class="t small">MOS — Marketing Operating System</text><text x="1480" y="26" class="m small">—</text><rect x="1507" y="12" width="13" height="13" rx="1.5" fill="none" stroke="#9eb6d1"/><path d="M1548 13l12 12m0-12-12 12" stroke="#c0d2e5" stroke-width="1.4"/>
<rect y="43" width="1600" height="82" fill="#0a1b2e"/><path d="M32 62l12 0 11 18-11 18H32l12-18z" fill="#4ba8ff"/><path d="M53 62h11L53 80l11 18H53L42 80z" fill="#7c78ff"/><text x="76" y="81" class="h" font-size="24">MOS</text><text x="76" y="101" class="s tiny">Intent workspace</text><rect x="305" y="60" width="690" height="46" rx="12" fill="#102945" stroke="#2b4d70"/><text x="333" y="87" class="m body">Ask anything about your marketing work…</text><rect x="1018" y="60" width="220" height="46" rx="12" fill="#123d78" stroke="#3d8eff"/><text x="1040" y="88" class="t small">Open agent composer</text><text x="1245" y="88" class="s tiny">⌘/Ctrl+J</text><circle cx="1301" cy="82" r="15" fill="#163d61"/><text x="1328" y="79" class="t small">Durable tasks</text><text x="1328" y="98" class="s tiny">Saved automatically</text>
<!-- left -->
<rect x="0" y="125" width="245" height="875" fill="#08192b"/><line x1="245" y1="125" x2="245" y2="1000" class="line"/><text x="25" y="160" class="s tiny" letter-spacing="2">WORKSPACE</text><g class="m body"><text x="62" y="203">Home</text><text x="62" y="249">Missions</text><text x="62" y="295">Research Lab</text><text x="62" y="341">Social Media</text><text x="62" y="387">Pay / Billing*</text><text x="62" y="433">Studio</text><text x="62" y="479">Activity &amp; Tasks</text></g><rect x="12" y="367" width="220" height="38" rx="8" fill="#123e7f" stroke="#3489ff"/><text x="25" y="391" class="t small">Pay / Billing*</text><line x1="20" y1="518" x2="223" y2="518" class="line"/><text x="25" y="548" class="s tiny">RECENT TASKS</text><circle cx="30" cy="580" r="5" fill="#54a7ff"/><text x="44" y="584" class="m small">Research content plan</text><circle cx="30" cy="615" r="5" fill="#3bd5aa"/><text x="44" y="619" class="m small">Audience research</text><circle cx="30" cy="650" r="5" fill="#e9b45a"/><text x="44" y="654" class="m small">Awaiting approval</text><rect x="15" y="935" width="215" height="46" rx="8" class="card"/><text x="30" y="954" class="t tiny">*Only if a real Pay</text><text x="30" y="971" class="s tiny">authority is integrated</text>
<!-- action context -->
<text x="275" y="164" class="s tiny" letter-spacing="2">ACTION-AWARE AGENT FLOW</text><text x="275" y="197" class="h" font-size="28">Start from the action. Finish with a task.</text><text x="275" y="225" class="m body">The composer understands what you clicked, what mission you're in, and what still needs clarification.</text>
<rect x="275" y="247" width="340" height="158" rx="14" fill="#112b46" stroke="#284c6e"/><circle cx="307" cy="280" r="18" fill="#17509a"/><path d="M300 278h14m-7-7v14M300 288h14" stroke="#fff" stroke-width="1.5" fill="none"/><text x="338" y="278" class="s tiny">STEP 1</text><text x="338" y="301" class="h" font-size="19">Click an action</text><text x="296" y="334" class="m small">Example: Pay a campaign invoice</text><text x="296" y="356" class="m small">or “Connect YouTube” / “Research”.</text><text x="296" y="383" class="s tiny">Action context carries into the composer</text>
<path d="M620 326h28l-6-6m6 6-6 6" stroke="#4f9bde" stroke-width="2" fill="none"/>
<rect x="657" y="247" width="355" height="158" rx="14" fill="#112b46" stroke="#284c6e"/><circle cx="689" cy="280" r="18" fill="#17509a"/><path d="M681 278h16M681 283h11M681 288h14" stroke="#fff" stroke-width="1.5"/><text x="720" y="278" class="s tiny">STEP 2</text><text x="720" y="301" class="h" font-size="19">Clarify by text or voice</text><text x="678" y="334" class="m small">Agent asks only what's missing.</text><text x="678" y="356" class="m small">Edit transcript before sending.</text><text x="678" y="383" class="s tiny">Text stays fully supported at all times</text>
<path d="M1017 326h27l-6-6m6 6-6 6" stroke="#4f9bde" stroke-width="2" fill="none"/>
<rect x="1054" y="247" width="508" height="158" rx="14" fill="#112b46" stroke="#284c6e"/><circle cx="1086" cy="280" r="18" fill="#17509a"/><path d="M1078 273h16v13h-8l-5 5v-5h-3z" stroke="#fff" fill="none" stroke-width="1.4"/><text x="1117" y="278" class="s tiny">STEP 3</text><text x="1117" y="301" class="h" font-size="19">Confirm the structured intent</text><text x="1077" y="334" class="m small">Show goal, scope, costs/resources, timeframe,</text><text x="1077" y="356" class="m small">permissions and the exact next action.</text><text x="1077" y="383" class="s tiny">No consequential side effect on this step</text>
<!-- dialogue -->
<rect x="275" y="428" width="770" height="488" rx="14" fill="#0e2540" stroke="#244667"/><text x="299" y="464" class="h" font-size="21">Ask MOS</text><text x="299" y="488" class="s small">Context: Pay / Billing · Draft intent only · No payment has been sent</text>
<rect x="299" y="510" width="708" height="77" rx="10" fill="#122e4c" stroke="#2b5276"/><circle cx="322" cy="534" r="10" fill="#2679ba"/><text x="342" y="537" class="t small">MOS agent</text><text x="319" y="561" class="m small">I can help prepare this payment request. Which recipient, amount,</text><text x="319" y="579" class="m small">currency and due date should I use?</text>
<rect x="458" y="601" width="549" height="64" rx="10" fill="#153f79" stroke="#3478cb"/><text x="478" y="625" class="t small">Invoice 8042 · 1,250 GHS · Due Friday · Vendor already selected</text><text x="478" y="647" class="s tiny">User text or confirmed voice transcript</text>
<rect x="299" y="681" width="708" height="118" rx="11" fill="#122e4c" stroke="#2b5276"/><text x="319" y="708" class="t small">MOS agent</text><text x="319" y="735" class="m small">Here is the request I understood. I will create the task for the connected</text><text x="319" y="757" class="m small">payment authority; any transfer still requires its policy checks and approval.</text><rect x="319" y="772" width="164" height="21" rx="6" fill="#174c43"/><text x="330" y="787" class="t tiny">Intent summary ready</text>
<rect x="299" y="815" width="708" height="73" rx="11" fill="#081a2c" stroke="#35536e"/><text x="318" y="838" class="m small">Answer MOS or add context…</text><rect x="318" y="851" width="35" height="24" rx="6" fill="#17334f"/><path d="M329 856v12m-5-6h10m-5-6v-3" stroke="#8ec4ed" stroke-width="1.5" fill="none"/><text x="364" y="868" class="s tiny">Voice input (optional)</text><rect x="948" y="842" width="42" height="35" rx="8" fill="url(#a3)"/><path d="M959 859h17m-6-6 6 6-6 6" stroke="#fff" stroke-width="1.6" fill="none"/>
<!-- task state -->
<rect x="1067" y="428" width="495" height="488" rx="14" fill="#0e2540" stroke="#244667"/><text x="1091" y="464" class="h" font-size="21">Task created</text><text x="1091" y="488" class="s small">A durable record confirms the task exists.</text>
<rect x="1091" y="512" width="447" height="130" rx="12" fill="#102d4b" stroke="#2d567c"/><rect x="1110" y="531" width="45" height="45" rx="12" fill="#174d8e"/><path d="M1122 546h20v14h-20zM1127 542h10" stroke="#cbe8ff" fill="none" stroke-width="1.5"/><text x="1170" y="539" class="s tiny">JOB • JOB-2081</text><text x="1170" y="564" class="h" font-size="18">Payment request review</text><rect x="1170" y="584" width="105" height="24" rx="12" fill="#64421a"/><text x="1187" y="600" class="t tiny">Awaiting approval</text><text x="1110" y="626" class="s tiny">Created by the real authority • saved and resumable</text>
<text x="1091" y="677" class="s tiny">TASK TIMELINE</text><circle cx="1100" cy="705" r="6" fill="#37d8ad"/><text x="1119" y="709" class="t small">Intent clarified</text><text x="1119" y="729" class="s tiny">Structured fields captured</text><circle cx="1100" cy="759" r="6" fill="#58a4ff"/><text x="1119" y="763" class="t small">Task queued</text><text x="1119" y="783" class="s tiny">Job status from authority/event stream</text><circle cx="1100" cy="813" r="6" fill="#e2b056"/><text x="1119" y="817" class="t small">Approval pending</text><text x="1119" y="837" class="s tiny">No transfer sent yet</text><rect x="1091" y="861" width="447" height="34" rx="7" fill="#123f7d" stroke="#3979bb"/><text x="1216" y="883" class="t small">Open task details ↗</text>
<text x="275" y="956" class="s tiny">Reference only • durable task creation must come from the authority • real Pay/payment flows remain outside MOS unless connected</text>
</svg>
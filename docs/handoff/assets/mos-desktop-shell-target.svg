<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">MOS desktop shell and Agent Console target layout</title>
<desc id="desc">Illustrative desktop UX map showing a native window titlebar, global search and agent composer toggle, scrollable MOS navigation, mission-first work area, collapsible inspector, and durable task activity.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0b1f38"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102945"/><stop offset="1" stop-color="#0a1d33"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <style>
    .t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e6f0ff}.m{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#a7bfdc}.s{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#6f8eaf}.h{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:700;fill:#f4f8ff}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:24px;font-weight:700}.line{stroke:#203d5c;stroke-width:1}.card{fill:#102640;stroke:#254767;stroke-width:1}.active{fill:#123e7f;stroke:#3489ff}
  </style>
</defs>
